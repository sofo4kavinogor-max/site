<div class="card mb-2" id="task-{{ task.id }}" data-status="{{ task.status }}" data-project="{{ task.project.id }}">
    <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <div class="fw-bold">{{ task.title }}</div>
                <div class="text-secondary small">{{ task.project.name }}</div>
            </div>
            <button class="btn btn-sm btn-ghost-danger" onclick="deleteTask({{ task.id }})">×</button>
        </div>
        <div class="mt-2 d-flex gap-2 align-items-center">
            <span class="badge bg-blue-lt">{{ task.get_priority_display }}</span>
            <select class="form-select form-select-sm w-auto"
                    onchange="updateStatus({{ task.id }}, this.value)">
                <option value="todo" {% if task.status == 'todo' %}selected{% endif %}>К выполнению</option>
                <option value="in_progress" {% if task.status == 'in_progress' %}selected{% endif %}>В работе</option>
                <option value="done" {% if task.status == 'done' %}selected{% endif %}>Выполнено</option>
            </select>
        </div>
    </div>
</div>
