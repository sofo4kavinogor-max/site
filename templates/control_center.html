{% extends 'base.html' %}
{% load static %}

{% block title %}Центр управления{% endblock %}
{% block page_title %}Центр управления задачами{% endblock %}

{% block content %}
<div class="row mb-3">
    <div class="col-md-3">
        <input type="text" class="form-control" id="ctrlSearch" placeholder="Поиск...">
    </div>
    <div class="col-md-3">
        <select class="form-select" id="ctrlStatus">
            <option value="">Все статусы</option>
            <option value="todo">К выполнению</option>
            <option value="in_progress">В работе</option>
            <option value="done">Выполнено</option>
        </select>
    </div>
    <div class="col-md-3">
        <select class="form-select" id="ctrlProject">
            <option value="">Все проекты</option>
        </select>
    </div>
    <div class="col-md-3">
        <button class="btn btn-primary w-100" onclick="openCreateModal()">
            + Добавить задачу
        </button>
    </div>
</div>

<div id="ctrlAlert"></div>

<div class="card">
    <div class="table-responsive">
        <table class="table table-vcenter card-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Задача</th>
                    <th>Проект</th>
                    <th>Статус</th>
                    <th>Приоритет</th>
                    <th>Срок</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="ctrlTable"></tbody>
        </table>
    </div>
</div>

<div class="modal modal-blur fade" id="ctrlModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="ctrlModalTitle">Новая задача</h5>
        <button type="button" class="btn-close" onclick="hideModal()"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="ctrlId">
        <div class="mb-3">
            <label class="form-label">Название</label>
            <input type="text" class="form-control" id="ctrlTitle">
            <div class="invalid-feedback" id="ctrlTitleError"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Приоритет</label>
            <select class="form-select" id="ctrlPrioritySelect">
                <option value="low">Низкий</option>
                <option value="medium" selected>Средний</option>
                <option value="high">Высокий</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Срок</label>
            <input type="date" class="form-control" id="ctrlDueDate">
        </div>
        <div class="mb-3">
            <label class="form-label">Проект</label>
            <select class="form-select" id="ctrlProjectSelect"></select>
        </div>
        <div class="mb-3">
            <label class="form-label">Статус</label>
            <select class="form-select" id="ctrlStatusSelect">
                <option value="todo">К выполнению</option>
                <option value="in_progress">В работе</option>
                <option value="done">Выполнено</option>
            </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-link" onclick="hideModal()">Отмена</button>
        <button type="button" class="btn btn-primary" onclick="saveTask()">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<div class="modal modal-blur fade" id="historyModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">История задачи</h5>
        <button type="button" class="btn-close" onclick="hideHistoryModal()"></button>
      </div>
      <div class="modal-body" id="historyBody"></div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{% static 'js/control.js' %}"></script>
{% endblock %}
