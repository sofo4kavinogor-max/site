<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flask Project{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px;
        }
        nav { margin-top: 10px; }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        nav a:hover { text-decoration: underline; }
        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 30px;
            background-color: white;
        }
        footer {
            max-width: 900px;
            margin: 20px auto;
            color: #777;
        }
    </style>
</head>
<body>

<header>
    <h1>Мой Flask-проект</h1>
    <nav>
        <a href="{{ url_for('index') }}">Главная</a>
        <a href="{{ url_for('about') }}">О проекте</a>
        <a href="{{ url_for('changelog') }}">Лог изменений</a>
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>Flask Project</footer>
</body>
</html>
