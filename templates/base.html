{% load static %}
<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task Manager{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'tabler/css/tabler.min.css' %}">
</head>
<body>
<div class="page">
    {% include 'partials/sidebar.html' %}

    <div class="page-wrapper">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title">{% block page_title %}{% endblock %}</h2>
                    </div>
                    <div class="col-auto ms-auto d-print-none">
                        <button class="btn btn-outline-secondary" onclick="toggleTheme()">
                            Тема
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</div>

<script src="{% static 'tabler/js/tabler.min.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
